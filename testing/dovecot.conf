# Test Dovecot: static users, Maildir, CONDSTORE/QRESYNC/IDLE on, plaintext auth (never expose this).
protocols = imap sieve
listen = *
log_path = /dev/stderr
mail_home = /srv/vmail/%n
mail_location = maildir:~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1
disable_plaintext_auth = no
auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  # allow_all_users: shared folders look up the other user without a password
  args = uid=vmail gid=vmail home=/srv/vmail/%n allow_all_users=yes
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
ssl = no

# Shared folders (RFC 4314 ACLs): users share their folders with each other; they appear under Shared/<user>/
mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}
namespace shared {
  type = shared
  separator = /
  prefix = Shared/%%n/
  location = maildir:%%h/Maildir:INDEXPVT=~/Maildir/shared/%%n
  subscriptions = no
  list = children
}
# Public folders (a shared namespace): u09 manages them and shares them with others (see global-acl)
namespace public {
  type = public
  separator = /
  prefix = Public/
  location = maildir:/srv/vmail/public:INDEXPVT=~/Maildir/public
  subscriptions = no
  list = children
}

# ManageSieve (filters and the vacation responder are uploaded here)
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
plugin {
  acl = vfile:/etc/dovecot/global-acl:cache_secs=1
  acl_shared_dict = file:/srv/vmail/shared-mailboxes.db
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_extensions = +editheader
}
