# Throwaway services for the automated tests. Everything lives in memory (tmpfs) and uses its own ports,
# so it never touches your dev database or real mail servers.
#   pnpm test:up     start      pnpm test      run the suite      pnpm test:down   stop
name: ncmail-test
services:
  postgres:
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    environment: { POSTGRES_USER: ncmail, POSTGRES_PASSWORD: ncmail, POSTGRES_DB: ncmail_test }
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ncmail -d ncmail_test"], interval: 2s, retries: 30 }

  dovecot:
    image: dovecot/dovecot:2.3-latest@sha256:547d28f9a893c93a1d2f6dc164880cd7bfa74009106dfa46b36a6a2ee636d921
    platform: linux/amd64        # the image is amd64-only; runs under emulation on Apple silicon
    ports: ["127.0.0.1:11143:143", "127.0.0.1:14190:4190"]
    volumes:
      - ./dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./users:/etc/dovecot/users:ro
      - ./global-acl:/etc/dovecot/global-acl:ro
    tmpfs: ["/srv/vmail:uid=1000,gid=1000"]   # uid/gid of the image's "vmail" user

  mailpit:                        # catches everything the app sends
    image: axllent/mailpit:latest@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
